backend:
  name: github
  repo: CNU-FPFT-Lab/cnu-fpft-lab.github.io
  branch: main
  base_url: https://cnu-fpft-decap-oauth.dkrnd2-e8e.workers.dev
  auth_endpoint: auth
  site_domain: cnu-fpft-lab.github.io

locale: ko
site_url: https://cnu-fpft-lab.github.io/
display_url: https://cnu-fpft-lab.github.io/

logo:
  src: https://bk21eef.jnu.ac.kr/CrossEditor/binary/newimages/images/000057/20240808174546636_OU7R1HSC.png
  show_in_header: true

media_folder: assets/uploads
public_folder: /assets/uploads
media_library:
  config:
    max_file_size: 15000000

collections:
  - label: "공지사항"
    name: "notices"
    description: "홈 화면에 표시되는 공지사항을 간단히 추가·수정합니다."
    editor:
      preview: false
    files:
      - label: "공지사항 목록"
        name: "notice_list"
        file: "data/notices.json"
        fields:
          - label: "공지"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            label_singular: "공지 추가"
            fields:
              - {label: "날짜", name: "date", widget: "string", hint: "예: 2026.10.02"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "짧은 요약", name: "meta", widget: "string", required: false}
              - {label: "상세 내용", name: "detail", widget: "text", required: false}
              - {label: "문의 이메일", name: "email", widget: "string", required: false}

  - label: "논문"
    name: "publications"
    description: "논문 서지정보를 추가·수정합니다. 새 논문은 목록 맨 위에 추가하세요."
    editor:
      preview: false
    files:
      - label: "논문 목록"
        name: "publication_list"
        file: "data/publications.json"
        fields:
          - label: "논문"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "논문 추가"
            field:
              label: "서지정보"
              name: "entry"
              widget: "text"
              hint: "형식: [번호] 저자 (연도). 논문제목. 저널, 권(호), 페이지."

  - label: "연구실 활동·사진"
    name: "activities"
    description: "학회, 수상, 연구실 활동과 대표 사진을 관리합니다."
    editor:
      preview: false
    files:
      - label: "활동 목록"
        name: "activity_list"
        file: "data/activities.json"
        fields:
          - label: "활동"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            label_singular: "활동 추가"
            fields:
              - {label: "ID", name: "id", widget: "string", hint: "영문 소문자와 하이픈 권장. 예: conference-busan-2027"}
              - {label: "기간·날짜", name: "date", widget: "string", hint: "예: 2026.10.01 또는 2026.07.22–24"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "분류", name: "type", widget: "string", required: false, hint: "예: 학회 · 수상 / 연구실 활동"}
              - {label: "장소", name: "location", widget: "string", required: false}
              - {label: "세부 설명", name: "detail", widget: "text", required: false}
              - label: "대표 사진"
                name: "image"
                widget: "image"
                choose_url: false
                allow_multiple: false
                hint: "원본 사진을 그대로 업로드하세요. 드래그앤드롭 또는 파일 선택을 사용할 수 있습니다."

  - label: "연구과제"
    name: "projects"
    description: "공개 중인 연구과제의 기관, 사업, 기간, 역할을 관리합니다."
    editor:
      preview: false
    files:
      - label: "연구과제 목록"
        name: "project_list"
        file: "data/projects.json"
        fields:
          - label: "연구과제"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}} · {{fields.role}}"
            label_singular: "과제 추가"
            fields:
              - {label: "상태", name: "status", widget: "select", options: ["수행 중", "완료", "예정"]}
              - {label: "지원기관", name: "agency", widget: "string", required: false}
              - {label: "지원사업", name: "program", widget: "string", required: false}
              - {label: "기간", name: "period", widget: "string", required: false, hint: "예: 2026.09.01–2027.08.31"}
              - {label: "과제명", name: "title", widget: "string"}
              - {label: "참여형태", name: "participation", widget: "string", required: false, hint: "예: 책임 / 공동"}
              - {label: "역할", name: "role", widget: "string", required: false, hint: "예: 연구책임자 / 공동연구원"}
