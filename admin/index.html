<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FPFT Lab 콘텐츠 편집</title>
  <style>
    :root{--green:#007a33;--blue:#003594;--ink:#18201b;--muted:#68716b;--line:#dfe6e1;--soft:#f4f7f5}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--soft)}
    .setup{min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(820px,100%);background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:10px;padding:36px;box-shadow:0 18px 55px rgba(13,37,25,.09)}
    .brand{font-weight:800;color:var(--green);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.card h1{font-size:32px;line-height:1.2;margin:10px 0 12px}.card p{color:var(--muted);line-height:1.7}.steps{counter-reset:item;margin:26px 0 0;padding:0;list-style:none}.steps li{position:relative;padding:14px 0 14px 44px;border-top:1px solid var(--line);line-height:1.6}.steps li::before{counter-increment:item;content:counter(item);position:absolute;left:0;top:13px;width:28px;height:28px;border-radius:50%;background:#e7f4ec;color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800}.code{display:block;background:#111814;color:#e6f1ea;padding:12px 14px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow:auto;margin-top:8px}.note{margin-top:22px;padding:14px 16px;background:#f3f6fb;border-left:3px solid var(--blue);color:#4a5662;font-size:13px}.links{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}.links a{display:inline-block;padding:10px 14px;border-radius:5px;font-size:13px;font-weight:700;text-decoration:none}.primary{background:var(--green);color:#fff}.secondary{border:1px solid var(--line);color:var(--ink);background:#fff}
  </style>
</head>
<body>
  <div id="preflight" class="setup">
    <main class="card"><div class="brand">CNU FPFT Lab</div><h1>콘텐츠 편집기 설정 확인 중</h1><p>GitHub OAuth 연결 상태를 확인하고 있습니다.</p></main>
  </div>
  <script>
    const placeholder = 'REPLACE_WITH_OAUTH_WORKER_URL';
    async function boot(){
      const root = document.getElementById('preflight');
      try{
        const config = await fetch('./config.yml',{cache:'no-store'}).then(r=>r.text());
        if(config.includes(placeholder)){
          root.innerHTML = `<main class="card"><div class="brand">CNU FPFT Lab</div><h1>무료 다중 사용자 편집기 준비 완료</h1><p>Decap CMS는 GitHub OAuth + 자체 Cloudflare Worker 인증 방식으로 전환되었습니다. 저장소 쪽 구성은 완료되었고, 최초 1회 GitHub OAuth App 등록과 Worker 배포만 남아 있습니다.</p><ol class="steps"><li>GitHub에서 OAuth App을 하나 생성합니다. Homepage URL은 <span class="code">https://cnu-fpft-lab.github.io/</span>로 입력합니다.</li><li>Cloudflare Workers에서 <strong>oauth-proxy/</strong> 폴더의 Worker를 배포합니다. 배포 후 주소는 보통 <span class="code">https://cnu-fpft-decap-oauth.&lt;계정명&gt;.workers.dev</span> 형태입니다.</li><li>GitHub OAuth App의 Authorization callback URL을 Worker 주소 + <span class="code">/callback?provider=github</span>로 정확히 등록합니다.</li><li>Worker에 GitHub OAuth Client ID, Client Secret, 임의의 긴 STATE_SECRET을 secret으로 등록합니다.</li><li>마지막으로 <strong>admin/config.yml</strong>의 <span class="code">base_url: ${placeholder}</span>를 실제 Worker 주소로 교체합니다.</li></ol><div class="note">학생은 각자 자신의 GitHub 계정으로 로그인합니다. 해당 학생 계정에는 CNU-FPFT-Lab/cnu-fpft-lab.github.io 저장소의 push 권한이 있어야 실제 저장이 가능합니다.</div><div class="links"><a class="primary" href="https://github.com/settings/developers" target="_blank" rel="noopener">GitHub OAuth Apps ↗</a><a class="secondary" href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare Dashboard ↗</a><a class="secondary" href="/">홈페이지</a></div></main>`;
          return;
        }
        root.remove();
        const script=document.createElement('script');
        script.src='https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
        document.body.appendChild(script);
      }catch(e){
        root.innerHTML='<main class="card"><div class="brand">CNU FPFT Lab</div><h1>설정 파일을 읽지 못했습니다.</h1><p>잠시 후 다시 시도하거나 GitHub의 <strong>admin/config.yml</strong>을 확인해 주세요.</p></main>';
      }
    }
    boot();
  </script>
</body>
</html>
