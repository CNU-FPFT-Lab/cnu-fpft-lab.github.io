<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FPFT Lab 콘텐츠 편집</title>
  <style>
    :root{--green:#007a33;--blue:#003594;--ink:#18201b;--muted:#68716b;--line:#dfe6e1;--soft:#f4f7f5}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--soft)}
    .setup{min-height:100vh;display:grid;place-items:center;padding:32px}.card{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:10px;padding:36px;box-shadow:0 18px 55px rgba(13,37,25,.09)}
    .brand{font-weight:800;color:var(--green);font-size:13px;letter-spacing:.08em;text-transform:uppercase}.card h1{font-size:32px;line-height:1.2;margin:10px 0 12px}.card p{color:var(--muted);line-height:1.7}.steps{counter-reset:item;margin:26px 0 0;padding:0;list-style:none}.steps li{position:relative;padding:14px 0 14px 44px;border-top:1px solid var(--line);line-height:1.55}.steps li::before{counter-increment:item;content:counter(item);position:absolute;left:0;top:13px;width:28px;height:28px;border-radius:50%;background:#e7f4ec;color:var(--green);display:grid;place-items:center;font-size:12px;font-weight:800}.code{display:block;background:#111814;color:#e6f1ea;padding:12px 14px;border-radius:6px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow:auto;margin-top:8px}.note{margin-top:22px;padding:14px 16px;background:#f3f6fb;border-left:3px solid var(--blue);color:#4a5662;font-size:13px}.links{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}.links a{display:inline-block;padding:10px 14px;border-radius:5px;font-size:13px;font-weight:700;text-decoration:none}.primary{background:var(--green);color:#fff}.secondary{border:1px solid var(--line);color:var(--ink);background:#fff}
  </style>
</head>
<body>
  <div id="preflight" class="setup">
    <main class="card">
      <div class="brand">CNU FPFT Lab</div>
      <h1>콘텐츠 편집기 설정 확인 중</h1>
      <p>관리자 설정 파일을 확인하고 있습니다.</p>
    </main>
  </div>
  <script>
    const placeholder = 'REPLACE_WITH_DECAP_TURBO_SITE_ID';
    async function boot(){
      const root = document.getElementById('preflight');
      try{
        const config = await fetch('./config.yml',{cache:'no-store'}).then(r=>r.text());
        if(config.includes(placeholder)){
          root.innerHTML = `<main class="card"><div class="brand">CNU FPFT Lab</div><h1>콘텐츠 편집기 준비 완료</h1><p>논문·사진·구성원·연구과제를 웹 폼으로 수정하는 관리 화면은 이미 구성되어 있습니다. 최초 1회만 Decap Turbo 사이트를 연결하면 됩니다.</p><ol class="steps"><li>Decap Turbo에서 계정을 만들고 Organization을 생성합니다.</li><li>GitHub를 연결한 뒤 저장소 <strong>CNU-FPFT-Lab/cnu-fpft-lab.github.io</strong>를 선택하여 Site를 생성합니다.</li><li>Branch는 <strong>main</strong>, Config path는 <strong>admin/config.yml</strong>, Admin interface URL은 아래 주소로 입력합니다.<span class="code">https://cnu-fpft-lab.github.io/admin/</span></li><li>생성 후 Overview의 <strong>Site ID</strong>를 복사합니다.</li><li>GitHub에서 <strong>admin/config.yml</strong>의 <span class="code">turbo_site_id: ${placeholder}</span>부분을 실제 Site ID로 교체합니다.</li></ol><div class="note">연결 후 이 페이지를 다시 열면 별도 설정 안내 대신 Decap CMS 로그인 및 편집 화면이 바로 표시됩니다.</div><div class="links"><a class="primary" href="https://decapcms.org/docs/turbo-getting-started/" target="_blank" rel="noopener">Decap Turbo 설정 안내 ↗</a><a class="secondary" href="/">홈페이지로 돌아가기</a></div></main>`;
          return;
        }
        root.remove();
        const script=document.createElement('script');
        script.src='https://cdn.jsdelivr.net/npm/decap-cms@3.17.0-beta.0/dist/decap-cms.js';
        document.body.appendChild(script);
      }catch(e){
        root.innerHTML='<main class="card"><div class="brand">CNU FPFT Lab</div><h1>설정 파일을 읽지 못했습니다.</h1><p>잠시 후 다시 시도하거나 GitHub의 <strong>admin/config.yml</strong> 파일을 확인해 주세요.</p></main>';
      }
    }
    boot();
  </script>
</body>
</html>
