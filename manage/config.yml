backend:
  name: github
  repo: CNU-FPFT-Lab/cnu-fpft-lab.github.io
  branch: main
  base_url: https://cnu-fpft-decap-oauth.dkrnd2-e8e.workers.dev
  auth_endpoint: auth
  site_domain: cnu-fpft-lab.github.io/manage

locale: ko
site_url: https://cnu-fpft-lab.github.io/
display_url: https://cnu-fpft-lab.github.io/

logo:
  src: https://bk21eef.jnu.ac.kr/CrossEditor/binary/newimages/images/000057/20240808174546636_OU7R1HSC.png
  show_in_header: true

media_folder: assets/uploads
public_folder: /assets/uploads
media_library:
  config:
    max_file_size: 15000000

collections:
  - label: "공지사항"
    name: "notices"
    description: "홈 화면의 공지사항을 관리합니다."
    editor: {preview: false}
    files:
      - label: "공지사항 목록"
        name: "notice_list"
        file: "data/notices.json"
        fields:
          - label: "공지"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            label_singular: "공지 추가"
            fields:
              - {label: "날짜", name: "date", widget: "string"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "짧은 요약", name: "meta", widget: "string", required: false}
              - {label: "상세 내용", name: "detail", widget: "text", required: false}
              - {label: "문의 이메일", name: "email", widget: "string", required: false}

  - label: "논문"
    name: "publications"
    description: "논문 서지정보 전체를 관리합니다."
    editor: {preview: false}
    files:
      - label: "논문 목록"
        name: "publication_list"
        file: "data/publications.json"
        fields:
          - label: "논문"
            name: "items"
            widget: "list"
            add_to_top: true
            label_singular: "논문 추가"
            field:
              label: "서지정보"
              name: "entry"
              widget: "text"
              hint: "형식: [번호] 저자 (연도). 논문제목. 저널, 권(호), 페이지."

  - label: "연구실 활동·사진"
    name: "activities"
    description: "활동, 수상, 학회 및 대표 사진을 관리합니다."
    editor: {preview: false}
    files:
      - label: "활동 목록"
        name: "activity_list"
        file: "data/activities.json"
        fields:
          - label: "활동"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} · {{fields.title}}"
            label_singular: "활동 추가"
            fields:
              - {label: "ID", name: "id", widget: "string", hint: "영문 소문자와 하이픈 권장"}
              - {label: "기간·날짜", name: "date", widget: "string"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "분류", name: "type", widget: "string", required: false}
              - {label: "장소", name: "location", widget: "string", required: false}
              - {label: "세부 설명", name: "detail", widget: "text", required: false}
              - label: "대표 사진"
                name: "image"
                widget: "image"
                choose_url: false
                allow_multiple: false
                hint: "원본 사진을 그대로 업로드하세요."

  - label: "구성원"
    name: "members"
    description: "연구책임자와 학생 정보를 관리합니다."
    editor: {preview: false}
    files:
      - label: "구성원 목록"
        name: "member_list"
        file: "data/members.json"
        fields:
          - label: "연구책임자"
            name: "pi"
            widget: "object"
            collapsed: true
            fields:
              - {label: "이름", name: "name", widget: "string"}
              - {label: "영문명", name: "name_en", widget: "string"}
              - {label: "직위", name: "role", widget: "string"}
              - {label: "이메일", name: "email", widget: "string"}
              - {label: "전화", name: "phone", widget: "string"}
              - {label: "교수실", name: "office", widget: "string"}
              - label: "프로필 사진"
                name: "photo"
                widget: "image"
                choose_url: false
                allow_multiple: false
                hint: "세로 사진 권장. 원본 그대로 업로드하세요."
              - {label: "소개", name: "intro", widget: "text", required: false}
          - label: "학생"
            name: "students"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} · {{fields.course}}"
            label_singular: "학생 추가"
            fields:
              - {label: "이름", name: "name", widget: "string"}
              - {label: "영문명", name: "name_en", widget: "string"}
              - label: "과정"
                name: "course"
                widget: "select"
                options:
                  - {label: "석사 과정 (M.S.)", value: "M.S."}
                  - {label: "박사 과정 (Ph.D.)", value: "Ph.D."}
                  - {label: "학·석사 연계과정", value: "B.S.–M.S. Integrated"}
                  - {label: "학부연구생", value: "Undergraduate Researcher"}
                  - {label: "졸업생", value: "Alumni"}
              - {label: "이메일", name: "email", widget: "string"}
              - label: "프로필 사진"
                name: "photo"
                widget: "image"
                required: false
                choose_url: false
                allow_multiple: false

  - label: "연구과제"
    name: "projects"
    description: "연구과제의 모든 공개 필드를 관리합니다."
    editor: {preview: false}
    files:
      - label: "연구과제 목록"
        name: "project_list"
        file: "data/projects.json"
        fields:
          - label: "연구과제"
            name: "items"
            widget: "list"
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}} · {{fields.role}}"
            label_singular: "과제 추가"
            fields:
              - {label: "상태", name: "status", widget: "select", options: ["수행 중", "완료", "예정"]}
              - {label: "지원기관", name: "agency", widget: "string", required: false}
              - {label: "지원사업", name: "program", widget: "string", required: false}
              - {label: "기간", name: "period", widget: "string", required: false}
              - {label: "과제명", name: "title", widget: "string"}
              - {label: "참여형태", name: "participation", widget: "string", required: false}
              - {label: "역할", name: "role", widget: "string", required: false}
              - {label: "설명", name: "detail", widget: "text", required: false}

  - label: "연구분야"
    name: "research"
    description: "Research 페이지의 연구분야, 대표 인포그래픽, 연구흐름, 세부 주제를 전체 관리합니다."
    editor: {preview: false}
    files:
      - label: "연구분야"
        name: "research_list"
        file: "data/research.json"
        fields:
          - label: "연구분야"
            name: "items"
            widget: "list"
            collapsed: true
            summary: "{{fields.number}} · {{fields.title}}"
            fields:
              - {label: "ID", name: "id", widget: "string", hint: "URL 식별자입니다. 기존 값은 가능하면 변경하지 마세요."}
              - {label: "번호", name: "number", widget: "string"}
              - {label: "제목", name: "title", widget: "string"}
              - {label: "보조 제목", name: "title_en", widget: "string", required: false}
              - {label: "설명", name: "summary", widget: "text", required: false}
              - label: "대표 인포그래픽"
                name: "overview_figure"
                widget: "image"
                required: false
                choose_url: false
                allow_multiple: false
                hint: "가로 1500 px 이상 권장. 원본 비율을 유지해 자동 표시됩니다."
              - label: "연구 흐름"
                name: "flow"
                widget: "list"
                required: false
                field: {label: "단계", name: "step", widget: "string"}
              - label: "세부 연구주제"
                name: "topics"
                widget: "list"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - {label: "주제명", name: "title", widget: "string"}
                  - {label: "키워드", name: "detail", widget: "string"}
                  - label: "연구 Figure"
                    name: "figure"
                    widget: "image"
                    required: false
                    choose_url: false
                    allow_multiple: false
